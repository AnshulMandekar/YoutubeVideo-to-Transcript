<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Transform YouTube lectures into beautifully organized notes with AI-powered analysis, structured summaries, and visual concept maps.">
    <title>LectureNotes — AI-Powered YouTube Lecture Notes</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Mermaid.js for flowcharts -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Background ambient glow -->
    <div class="ambient-bg">
        <div class="ambient-orb ambient-orb-1"></div>
        <div class="ambient-orb ambient-orb-2"></div>
        <div class="ambient-orb ambient-orb-3"></div>
    </div>

    <!-- Main App Shell -->
    <div id="app">
        <!-- Navigation -->
        <nav class="navbar" id="navbar">
            <div class="navbar-inner">
                <a href="#/" class="navbar-brand" id="nav-brand">
                    <span class="brand-icon">📒</span>
                    <span class="brand-text">LectureNotes</span>
                </a>
                <div class="navbar-actions">
                    <button class="btn btn-primary btn-glow" id="btn-add-video" onclick="openAddModal()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Add Video</span>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Page Content -->
        <main class="main-content" id="main-content">
            <!-- Dashboard and Video Detail views are injected here by JS -->
        </main>
    </div>

    <!-- Add Video Modal -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeAddModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 class="modal-title">Add YouTube Video</h2>
                <button class="modal-close" id="btn-modal-close" onclick="closeAddModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Input State -->
            <div class="modal-body" id="modal-input">
                <p class="modal-description">Paste a YouTube video URL and we'll generate structured lecture notes with AI.</p>
                <div class="input-group">
                    <div class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19.13C5.12 19.56 12 19.56 12 19.56s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
                            <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
                        </svg>
                    </div>
                    <input
                        type="url"
                        id="input-youtube-url"
                        class="input-field"
                        placeholder="https://www.youtube.com/watch?v=..."
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>
                <div class="modal-error" id="modal-error"></div>
                <button class="btn btn-primary btn-lg btn-full" id="btn-submit-url" onclick="submitVideo()">
                    <span>Generate Notes</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="13 17 18 12 13 7"></polyline>
                        <polyline points="6 17 11 12 6 7"></polyline>
                    </svg>
                </button>
            </div>

            <!-- Processing State -->
            <div class="modal-body modal-processing hidden" id="modal-processing">
                <div class="processing-steps">
                    <div class="step" id="step-metadata">
                        <div class="step-indicator">
                            <div class="step-dot"></div>
                        </div>
                        <div class="step-content">
                            <span class="step-label">Fetching video metadata</span>
                            <span class="step-status"></span>
                        </div>
                    </div>
                    <div class="step" id="step-transcript">
                        <div class="step-indicator">
                            <div class="step-dot"></div>
                        </div>
                        <div class="step-content">
                            <span class="step-label">Extracting transcript</span>
                            <span class="step-status"></span>
                        </div>
                    </div>
                    <div class="step" id="step-notes">
                        <div class="step-indicator">
                            <div class="step-dot"></div>
                        </div>
                        <div class="step-content">
                            <span class="step-label">Generating lecture notes with AI</span>
                            <span class="step-status"></span>
                        </div>
                    </div>
                    <div class="step" id="step-flowchart">
                        <div class="step-indicator">
                            <div class="step-dot"></div>
                        </div>
                        <div class="step-content">
                            <span class="step-label">Creating concept flowchart</span>
                            <span class="step-status"></span>
                        </div>
                    </div>
                </div>
                <div class="processing-loader">
                    <div class="loader-bar"></div>
                </div>
                <p class="processing-hint">This may take 15–60 seconds depending on the video length.</p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/video-detail.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
